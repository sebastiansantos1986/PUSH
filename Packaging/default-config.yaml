# Only used when no previous config exists. Local verification starts without automation.
update:
  deadlineRecoveryEnabled: true
  retryCountdownMinutes: 10
  retryBackoffMinutes: 30
  maxAutomaticRetriesPerDay: 3
  allowUserUpdateRequests: true
  targetVersion: ""
  deadline: ""  # Explicit ISO 8601 override; blank uses the automatic deadline
  prepareAtDeadlineWhenLoggedOut: true
  silentInstallAfterDeadline: false
  autoInstallAfterDeadline: false
ui:
  menuBarEnabled: true
  appName: "PUSH — Software Update"
auto:
  enabled: false
  trackLatest: false
  minorOnly: true
  useMist: true
  minorDeadlineDays: 7
  majorDeadlineDays: 14
  autoInstallNonSystemUpdates: false
uptime:
  enabled: false
debug:
  dryRun: true

# Third-party apps are opt-in; no applications are installed by this package.
apps:
  enabled: false
  approved: ""
  autoUpdateClosed: false
  notifyHourly: true
  graceDays: 7

# Registration reminders are opt-in and do not assess cloud compliance.
entra:
  enabled: false
  policyID: "876"
  startHour: 8
  endHour: 18
  weekdaysOnly: true
  skipMeetings: true
  reconOnRegistration: true

# Saved hours are optional; reminders may run on weekends when a user is logged in.
schedule:
  respectAlertWindow: false
  alertStartHour: 8
  alertEndHour: 18
  skipWeekends: true

# Visual policy is opt-in; the default image is bundled.
compliance:
  wallpaperEnabled: false
  nonCompliantWallpaper: "/Library/Management/PUSH/assets/wallpapers/PUSH-NonCompliant.png"
  compliantWallpaper: ""
